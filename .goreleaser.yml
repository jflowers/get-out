version: 2

builds:
  - main: ./cmd/get-out
    binary: get-out
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - man/get-out.1

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  groups:
    - title: "Features"
      regexp: '^.*?feat(\(.+\))?\!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\(.+\))?\!?:.+$'
      order: 1
    - title: "Documentation"
      regexp: '^.*?docs(\(.+\))?\!?:.+$'
      order: 2
    - title: "Other"
      order: 999

homebrew_casks:
  - name: get-out
    directory: Casks
    repository:
      owner: jflowers
      name: homebrew-tools
    homepage: https://github.com/jflowers/get-out
    description: >-
      Export Slack messages (DMs, groups, channels) to organized Google Docs
    binaries:
      - get-out
    manpages:
      - man/get-out.1
    # skip_upload: true: GoReleaser writes the cask to dist/ (a release asset,
    # below); jflowers/ship's go-release.yml sets its darwin sha256s to the
    # signed archives', audits and install-checks it, and pushes it to the tap.
    skip_upload: true

release:
  github:
    owner: jflowers
    name: get-out
  prerelease: auto
  make_latest: true
  extra_files:
    - glob: dist/homebrew/Casks/get-out.rb
