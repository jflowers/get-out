name: Release

# Run from main with the version tag (don't push tags yourself):
#
#   gh workflow run release.yml -f tag=v1.4.0
#
# The pipeline is jflowers/ship's shared go-release.yml, the same one
# replicator, dewey, gaze and unbound-force use:
#
# - org-infra's preflight checks the tag (semver, new, newer than the last),
#   that build-and-test passed on HEAD and that there are unreleased
#   commits, then creates the tag;
# - GoReleaser (org-infra) builds the archives, checksums, cosign signatures
#   and SBOMs, and the cask as a release asset;
# - the darwin binaries are signed with the Developer ID and notarized, the
#   archives re-uploaded and checksums.txt rewritten;
# - the cask gets the signed checksums, is audited (brew audit --strict),
#   installed from a copy of the tap and checked, and pushed to
#   jflowers/homebrew-tools.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.4.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: jflowers/ship/.github/workflows/go-release.yml@7c6c0e199099d732e0db93c8c9d86b0064c2759c # v0.9.0
    with:
      tag: ${{ inputs.tag }}
      ci_checks: '["build-and-test"]'
      tap: jflowers/homebrew-tools
      cask_install_check: |
        test -x "$HOMEBREW_PREFIX/bin/get-out"
        "$HOMEBREW_PREFIX/bin/get-out" --version
        test -f "$HOMEBREW_PREFIX/share/man/man1/get-out.1"
    permissions:
      contents: write
      checks: read
      id-token: write
    secrets:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
